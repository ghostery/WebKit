name: Build validate-dnr-rules

on:
  push:
    branches: [ghostery/*]
    paths:
      - 'ghostery/validate-dnr-rules/**'
      - 'Source/WebCore/contentextensions/**'
      - 'Source/WTF/**'
      - 'CMakeLists.txt'
      - '.github/workflows/validate-dnr-rules.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config unifdef ruby \
            libicu-dev libglib2.0-dev libcairo2-dev libharfbuzz-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libsoup-3.0-dev libepoxy-dev \
            libxslt1-dev libmanette-0.2-dev \
            libsecret-1-dev libtasn1-6-dev libsystemd-dev \
            libgcrypt20-dev libwebp-dev liblcms2-dev libopenjp2-7-dev \
            libavif-dev libjxl-dev libgirepository1.0-dev gobject-introspection \
            libdrm-dev libgbm-dev libinput-dev libudev-dev wayland-protocols \
            libwayland-dev libgtk-4-dev libenchant-2-dev \
            libatspi2.0-dev gi-docgen

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ matrix.name }}-${{ hashFiles('Source/WTF/**', 'Source/WebCore/contentextensions/**', 'ghostery/validate-dnr-rules/**') }}
          restore-keys: |
            cmake-${{ matrix.name }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPORT=GTK \
            -DENABLE_TOOLS=OFF \
            -DENABLE_API_TESTS=OFF \
            .

      - name: Build validate-dnr-rules
        run: cmake --build build --target validate-dnr-rules

      - name: Test
        run: |
          cat > /tmp/test-rules.json << 'RULES'
          [
            {"id":1,"priority":1,"action":{"type":"block"},"condition":{"regexFilter":"ad[0-9]{2}\\.js"}},
            {"id":2,"priority":1,"action":{"type":"block"},"condition":{"regexFilter":"(?:ads|tracking)\\.com"}},
            {"id":3,"priority":1,"action":{"type":"block"},"condition":{"regexFilter":"tracker\\d+\\.js"}},
            {"id":4,"priority":1,"action":{"type":"block"},"condition":{"regexFilter":"pixel\\b"}}
          ]
          RULES
          ./build/validate-dnr-rules /tmp/test-rules.json

      - name: Binary info
        run: |
          file build/validate-dnr-rules
          du -h build/validate-dnr-rules
          ldd build/validate-dnr-rules || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: validate-dnr-rules-${{ matrix.name }}
          path: build/validate-dnr-rules
